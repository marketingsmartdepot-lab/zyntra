# Compila o agente de impressão num executável do Windows.
#
# Roda no Windows de propósito: binário de Windows montado num Mac é binário
# que ninguém abriu antes de entregar. Aqui ele é gerado e aberto na mesma
# máquina, e o passo de conferência falha o build se o executável não rodar.
name: Agente de impressão

on:
  push:
    branches: [main]
    paths: ["agente/**", ".github/workflows/agente.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agente

    steps:
      - uses: actions/checkout@v4

      # O Node oficial traz o empacotador habilitado; algumas distribuições o
      # desligam na compilação, e aí o passo de empacotar falha.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Empacotar
        run: npm run empacotar

      - name: Conferir que o executável abre
        run: |
          $saida = & .\dist\ZyntraAgente.exe --versao
          Write-Host "versão: $saida"
          if (-not $saida) { throw "o executável não respondeu --versao" }

      # 83 MB é o tamanho do Node inteiro, que vai dentro do executável. O
      # limite de arquivo do plano é 50 MB, e é por isso que ele precisa
      # encolher — comprimido fica em torno de 28 MB.
      - name: Comprimir
        run: |
          choco install upx --no-progress -y
          $antes = (Get-Item .\dist\ZyntraAgente.exe).Length
          upx --best .\dist\ZyntraAgente.exe
          $depois = (Get-Item .\dist\ZyntraAgente.exe).Length
          Write-Host ("de {0} MB para {1} MB" -f [int]($antes/1MB), [int]($depois/1MB))
          if ($depois -ge 50MB) { throw "ainda acima de 50 MB — nao cabe no Storage" }

      # A conferência mais importante do workflow. Comprimir mexe nas seções do
      # executável, e o código do agente vive numa delas. Se a compressão
      # quebrar isso, é AQUI que se descobre — não na bancada.
      - name: Conferir que o executável comprimido ainda abre
        run: |
          $saida = & .\dist\ZyntraAgente.exe --versao
          Write-Host "versão apos comprimir: $saida"
          if (-not $saida) { throw "a compressao quebrou o executavel" }

      - name: Conferir que enxerga as impressoras
        run: |
          # Não é teste de impressão — é conferir que a descoberta funciona
          # neste Windows, que é o passo que substituiu o nome digitado à mão.
          # Informativo: máquina de CI sem spooler não é motivo para não haver
          # executável para baixar.
          try {
            $n = (Get-Printer -ErrorAction Stop | Measure-Object).Count
            Write-Host "$n impressora(s) visíveis para o agente"
          } catch {
            Write-Host "sem spooler nesta máquina de CI: $($_.Exception.Message)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ZyntraAgente-windows
          path: |
            agente/dist/ZyntraAgente.exe
            agente/instalar.ps1
          if-no-files-found: error
